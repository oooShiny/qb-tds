name: Update TDs and deploy

on:
  # Tue + Fri mornings (after MNF / TNF land in nflverse's nightly pbp refresh)
  schedule:
    - cron: "0 12 * * 2,5"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      season:
        description: "Season to fetch (blank = current)"
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"

      - name: Fetch new TDs from nflverse
        if: github.event_name != 'push'
        run: php fetch-nflverse.php ${{ inputs.season && format('--season={0}', inputs.season) || '' }}

      - name: Commit updated JSON
        if: github.event_name != 'push'
        run: |
          git add json/
          if git diff --cached --quiet; then
            echo "No new TDs."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto-update QB TDs from nflverse"
          git push

      - name: Build site
        run: php build.php

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
